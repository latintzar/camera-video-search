name: Video source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12
      - name: CPU media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: make install
      - run: .venv/bin/python -m pip check
      - run: make test
      - name: Retained processed sample and real HTTP backend
        run: .venv/bin/python tools/check-processed-sample.py
      - name: Failed offline contract details
        if: failure()
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json,re
          directory=Path('.local/verification')
          checks=json.loads((directory/'checks.json').read_text())
          for row in checks['suites']:
              if not row['returncode']:
                  continue
              print('Failed suite:',row['suite'])
              for line in (directory/(row['suite']+'.log')).read_text().splitlines()[-120:]:
                  line=re.sub(r'"[^"\n]*"|\x27[^\x27\n]*\x27','<literal>',line)
                  if not line.startswith('FAILED harness/tests/'):
                      line=re.sub(r'\S{80,}','<long value>',line)
                  print(line)
          PY
      - run: node --check harness/verticals/retail/web/control-room/app.js
